{% extends 'base.html' %}


{% block title %}
Browse Jobs - Job Portal
{% endblock %}



{% block content %}
<!-- Tailwind CDN (if not added) -->
<script src="https://cdn.tailwindcss.com"></script>

<div class="max-w-6xl mx-auto mt-10 px-4">

    <h2 class="text-2xl font-bold text-gray-800 mb-6">
        Latest Jobs
    </h2>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">



        {% for job in jobs %}
        <div class="bg-white shadow-md rounded-lg p-6 hover:shadow-lg transition">
            <img src="{{ job.company_logo.url }}" alt="Company Logo" class="w-24 h-24 object-cover rounded-lg border">
            
            <h3 class="text-lg font-semibold text-gray-800 mb-2">
                {{ job.job_title }}
            </h3>

            <p class="text-gray-600 text-sm mb-1">Company: {{ job.company_name }}</p>
            <p class="text-gray-600 text-sm mb-1">Openings: {{ job.vacancy }}</p>
            <p class="text-gray-600 text-sm mb-4">Category: {{ job.category }}</p>

            <a href="{% url 'single_job_view' job.id %}"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                View Details
            </a>
        </div>
        {% endfor %}




    </div>

</div>
{% endblock %}
