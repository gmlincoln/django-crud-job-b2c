{% extends 'base.html' %}



{% block title %}
Add Job - Job Portal
{% endblock %}



{% block content %}

<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-lg shadow">

    <h2 class="text-2xl font-bold mb-6 text-gray-800">
        Add New Job
    </h2>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}

        <!-- Job Title -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Job Title
            </label>
            <input type="text" name="title"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter job title">
        </div>

        <!-- Company Name -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Company Name
            </label>
            <input type="text" name="company_name"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter company name">
        </div>

        <!-- Company Logo -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Company Logo
            </label>
            <input type="file" name="logo" class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white">
        </div>

        <!-- Number of Openings -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Number of Openings
            </label>
            <input type="number" name="openings"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter number of openings">
        </div>

        <!-- Category -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Category
            </label>
            <select name="category"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Select Category</option>
                <option value="Part Time">Part Time</option>
                <option value="Full Time">Full Time</option>
            </select>
        </div>

        <!-- Description -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Description
            </label>
            <textarea name="description" rows="4"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter job description"></textarea>
        </div>

        <!-- Skills -->
        <div>
            <label class="block text-gray-700 font-medium mb-2">
                Skills
            </label>
            <input type="text" name="skills"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g. HTML, CSS, Django">
        </div>

        <!-- Submit Button -->
        <div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Submit Job
            </button>
        </div>

    </form>

</div>


{% endblock %}
