{% extends 'base.html' %}


{% block title %}
Home - Job Portal
{% endblock %}



{% block content %}
<div class="flex justify-center flex-col items-center">
    <h2 class="text-3xl font-bold text-gray-800 mb-4">
        Welcome to Job Portal
    </h2>
    <p class="text-gray-600 mb-6">
        Find jobs easily or post new job opportunities.
    </p>

    <div class="space-x-4">
        <a href="{% url 'browse_jobs' %}" class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">
            Browse Jobs
        </a>
        
        <a href="{% url 'add_job' %}" class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">
            Add Job
        </a>

    </div>
</div>
{% endblock %}
